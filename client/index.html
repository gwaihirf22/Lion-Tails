<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      This head was empty apart from the two lines above: no title, so the
      browser tab showed the URL; no icon, so the tab was blank; and no Open
      Graph tags, so sharing the site in a message or a group chat produced a
      grey link with nothing in it. For an app people are meant to pass to
      other parents, that last one is the costly omission.

      og-cover.jpg is the cover art cropped to 1.91:1 -- the ratio the
      scrapers use -- centred so the wordmark and the tagline both survive the
      crop. Files here in client/public are copied verbatim to the site root,
      so these URLs are stable; the hero image is imported through Vite
      instead, because there it should be fingerprinted and cache-busted.

      og:image is ABSOLUTE, with the domain written in. Stable is not enough:
      the Open Graph spec asks for a full URL, and a crawler that does not
      resolve "/og-cover.jpg" against the page shows the card with no picture.
      A shared story's page (/s/:token) replaces all of these with its own --
      see server/lib/pageMeta.ts -- building its URLs from the request.
    -->
    <title>Lion Tails — Real Stories. Timeless Truths.</title>
    <meta
      name="description"
      content="Learn the key events and people of Scripture and church history the way anyone actually remembers them — as stories worth staying awake for, with the characters you choose in them."
    />
    <meta name="theme-color" content="#1a1208" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lion Tails" />
    <meta property="og:title" content="Lion Tails — Real Stories. Timeless Truths." />
    <meta
      property="og:description"
      content="Scripture and church history as stories worth staying awake for, with the characters you choose in them."
    />
    <meta property="og:image" content="https://liontails.paul-blake.com/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A lion and a lantern-keeper outside Barnabas & Co., with scenes from Scripture and church history winding away behind them."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
