<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="600px" viewBox="0 0 800 600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Garden of Eden</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Sky -->
        <rect fill="#B3E5FC" x="0" y="0" width="800" height="250"></rect>
        
        <!-- Sun -->
        <circle fill="#FFD54F" cx="650" cy="100" r="60"></circle>
        <circle fill="#FFECB3" cx="650" cy="100" r="45"></circle>
        
        <!-- Clouds -->
        <circle fill="#FFFFFF" cx="100" cy="100" r="30" opacity="0.8"></circle>
        <circle fill="#FFFFFF" cx="130" cy="90" r="25" opacity="0.8"></circle>
        <circle fill="#FFFFFF" cx="150" cy="110" r="20" opacity="0.8"></circle>
        
        <circle fill="#FFFFFF" cx="400" cy="80" r="25" opacity="0.8"></circle>
        <circle fill="#FFFFFF" cx="430" cy="70" r="20" opacity="0.8"></circle>
        <circle fill="#FFFFFF" cx="450" cy="90" r="15" opacity="0.8"></circle>
        
        <!-- Distant Mountains -->
        <path d="M0,250 L150,180 L250,220 L350,150 L450,200 L550,150 L650,220 L800,180 L800,250 Z" fill="#90CAF9" opacity="0.5"></path>
        
        <!-- Grass Ground -->
        <rect fill="#66BB6A" x="0" y="250" width="800" height="350"></rect>
        
        <!-- River -->
        <path d="M350,250 C300,300 500,350 450,400 C400,450 500,500 400,600" fill="#4FC3F7" opacity="0.7"></path>
        
        <!-- River Banks -->
        <path d="M350,250 C320,280 330,300 320,320 C310,340 300,380 280,400 C260,420 300,450 280,470 C260,490 280,520 260,550 C240,580 220,600 220,600 L0,600 L0,250 Z" fill="#81C784" opacity="0.5"></path>
        <path d="M450,400 C480,420 470,450 500,470 C530,490 520,520 550,550 C580,580 600,600 600,600 L800,600 L800,250 L550,250 C520,280 510,300 520,320 C530,340 540,350 520,370 L450,400" fill="#81C784" opacity="0.5"></path>
        
        <!-- Trees -->
        <!-- Tree 1 (big) -->
        <rect fill="#795548" x="150" y="300" width="20" height="100"></rect>
        <circle fill="#2E7D32" cx="160" cy="250" r="50"></circle>
        <circle fill="#388E3C" cx="120" cy="270" r="40"></circle>
        <circle fill="#388E3C" cx="200" cy="270" r="40"></circle>
        <circle fill="#388E3C" cx="160" cy="210" r="30"></circle>
        
        <!-- Tree 2 -->
        <rect fill="#795548" x="600" y="350" width="15" height="80"></rect>
        <circle fill="#2E7D32" cx="608" cy="310" r="40"></circle>
        <circle fill="#388E3C" cx="580" cy="330" r="30"></circle>
        <circle fill="#388E3C" cx="635" cy="330" r="30"></circle>
        
        <!-- Tree 3 -->
        <rect fill="#795548" x="500" y="320" width="12" height="70"></rect>
        <circle fill="#2E7D32" cx="506" cy="290" r="30"></circle>
        <circle fill="#388E3C" cx="486" cy="300" r="20"></circle>
        <circle fill="#388E3C" cx="526" cy="300" r="20"></circle>
        
        <!-- Tree 4 -->
        <rect fill="#795548" x="250" y="340" width="15" height="75"></rect>
        <circle fill="#2E7D32" cx="258" cy="300" r="35"></circle>
        <circle fill="#388E3C" cx="235" cy="320" r="25"></circle>
        <circle fill="#388E3C" cx="280" cy="320" r="25"></circle>
        
        <!-- Tree 5 (Special Tree of Knowledge) -->
        <rect fill="#5D4037" x="400" y="300" width="18" height="90"></rect>
        <circle fill="#33691E" cx="410" cy="260" r="45"></circle>
        <circle fill="#558B2F" cx="375" cy="280" r="30"></circle>
        <circle fill="#558B2F" cx="445" cy="280" r="30"></circle>
        
        <!-- Fruits on the Tree of Knowledge -->
        <circle fill="#F44336" cx="380" cy="250" r="8"></circle> <!-- Red apple -->
        <circle fill="#F44336" cx="420" cy="235" r="8"></circle> <!-- Red apple -->
        <circle fill="#F44336" cx="440" cy="270" r="8"></circle> <!-- Red apple -->
        <circle fill="#F44336" cx="390" cy="270" r="8"></circle> <!-- Red apple -->
        
        <!-- Serpent in the Tree -->
        <path d="M410,290 C425,280 435,295 420,310 C405,325 415,340 430,325 C445,310 455,320 440,335" stroke="#8D6E63" stroke-width="10" stroke-linecap="round" fill="none"></path>
        <circle fill="#A1887F" cx="440" cy="335" r="8"></circle> <!-- Head -->
        <circle fill="#000000" cx="442" cy="332" r="2"></circle> <!-- Eye -->
        <path d="M440,338 L445,342" stroke="#000000" stroke-width="1"></path> <!-- Tongue -->
        
        <!-- Adam and Eve (Simplified) -->
        <!-- Adam -->
        <circle fill="#FFCC99" cx="300" cy="430" r="20"></circle> <!-- Head -->
        <rect fill="#FF5722" x="290" y="450" width="20" height="60"></rect> <!-- Body -->
        <rect fill="#FFCC99" x="280" y="460" width="10" height="30"></rect> <!-- Left Arm -->
        <rect fill="#FFCC99" x="310" y="460" width="10" height="30"></rect> <!-- Right Arm -->
        <rect fill="#FFCC99" x="290" y="510" width="8" height="40"></rect> <!-- Left Leg -->
        <rect fill="#FFCC99" x="302" y="510" width="8" height="40"></rect> <!-- Right Leg -->
        
        <!-- Eve -->
        <circle fill="#FFCC99" cx="350" cy="430" r="20"></circle> <!-- Head -->
        <rect fill="#26A69A" x="340" y="450" width="20" height="60"></rect> <!-- Body -->
        <rect fill="#FFCC99" x="330" y="460" width="10" height="30"></rect> <!-- Left Arm -->
        <rect fill="#FFCC99" x="360" y="460" width="10" height="30"></rect> <!-- Right Arm -->
        <rect fill="#FFCC99" x="340" y="510" width="8" height="40"></rect> <!-- Left Leg -->
        <rect fill="#FFCC99" x="352" y="510" width="8" height="40"></rect> <!-- Right Leg -->
        
        <!-- Animals -->
        <!-- Lion -->
        <circle fill="#FFB74D" cx="500" cy="500" r="25"></circle> <!-- Body -->
        <circle fill="#FFA726" cx="470" cy="490" r="15"></circle> <!-- Head -->
        <path d="M465,487 C460,480 455,485 458,490" stroke="#FFA726" stroke-width="3" fill="#FFA726"></path> <!-- Ear -->
        <path d="M475,487 C480,480 485,485 482,490" stroke="#FFA726" stroke-width="3" fill="#FFA726"></path> <!-- Ear -->
        <path d="M450,490 C460,470 480,470 470,490" stroke="#FF9800" stroke-width="6" fill="#FF9800"></path> <!-- Mane -->
        
        <!-- Sheep -->
        <circle fill="#FFFFFF" cx="200" cy="480" r="20"></circle> <!-- Body -->
        <circle fill="#E0E0E0" cx="180" cy="470" r="12"></circle> <!-- Head -->
        <rect fill="#616161" x="195" y="495" width="6" height="25"></rect> <!-- Leg -->
        <rect fill="#616161" x="205" y="495" width="6" height="25"></rect> <!-- Leg -->
        
        <!-- Deer -->
        <circle fill="#A1887F" cx="650" cy="450" r="25"></circle> <!-- Body -->
        <circle fill="#8D6E63" cx="680" cy="435" r="15"></circle> <!-- Head -->
        <path d="M675,420 L685,400" stroke="#8D6E63" stroke-width="3"></path> <!-- Antler -->
        <path d="M685,420 L695,400" stroke="#8D6E63" stroke-width="3"></path> <!-- Antler -->
        
        <!-- Flowers and Plants -->
        <circle fill="#E91E63" cx="250" cy="500" r="8"></circle> <!-- Pink flower -->
        <circle fill="#FFEB3B" cx="255" cy="500" r="4"></circle> <!-- Center -->
        <circle fill="#E91E63" cx="370" cy="520" r="8"></circle> <!-- Pink flower -->
        <circle fill="#FFEB3B" cx="375" cy="520" r="4"></circle> <!-- Center -->
        <circle fill="#9C27B0" cx="580" cy="520" r="8"></circle> <!-- Purple flower -->
        <circle fill="#FFEB3B" cx="585" cy="520" r="4"></circle> <!-- Center -->
        <circle fill="#9C27B0" cx="420" cy="480" r="8"></circle> <!-- Purple flower -->
        <circle fill="#FFEB3B" cx="425" cy="480" r="4"></circle> <!-- Center -->
        <circle fill="#F44336" cx="320" cy="540" r="8"></circle> <!-- Red flower -->
        <circle fill="#FFEB3B" cx="325" cy="540" r="4"></circle> <!-- Center -->
        <circle fill="#F44336" cx="550" cy="490" r="8"></circle> <!-- Red flower -->
        <circle fill="#FFEB3B" cx="555" cy="490" r="4"></circle> <!-- Center -->
        
        <!-- Small Bushes -->
        <circle fill="#4CAF50" cx="150" cy="530" r="20"></circle>
        <circle fill="#4CAF50" cx="700" cy="530" r="25"></circle>
        <circle fill="#4CAF50" cx="450" cy="550" r="15"></circle>
    </g>
</svg>