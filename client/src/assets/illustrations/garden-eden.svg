  <path d="M300,505 L320,515" stroke="#795548" stroke-width="5" fill="none" /> <!-- Right arm -->
  <path d="M300,530 L290,560" stroke="#795548" stroke-width="5" fill="none" /> <!-- Left leg -->
  <path d="M300,530 L310,560" stroke="#795548" stroke-width="5" fill="none" /> <!-- Right leg -->
  
  <!-- Eve -->
  <circle cx="500" cy="470" r="15" fill="#8d6e63" /> <!-- Head -->
  <path d="M500,485 L500,530" stroke="#8d6e63" stroke-width="8" fill="none" /> <!-- Body -->
  <path d="M500,505 L480,515" stroke="#8d6e63" stroke-width="5" fill="none" /> <!-- Left arm -->
  <path d="M500,505 L520,515" stroke="#8d6e63" stroke-width="5" fill="none" /> <!-- Right arm -->
  <path d="M500,530 L490,560" stroke="#8d6e63" stroke-width="5" fill="none" /> <!-- Left leg -->
  <path d="M500,530 L510,560" stroke="#8d6e63" stroke-width="5" fill="none" /> <!-- Right leg -->
  
  <!-- Sun rays -->
  <circle cx="700" cy="100" r="40" fill="#ffeb3b" />
  <path d="M700,40 L700,10" stroke="#ffeb3b" stroke-width="3" fill="none" />
  <path d="M700,160 L700,190" stroke="#ffeb3b" stroke-width="3" fill="none" />
  <path d="M640,100 L610,100" stroke="#ffeb3b" stroke-width="3" fill="none" />
  <path d="M760,100 L790,100" stroke="#ffeb3b" stroke-width="3" fill="none" />
  <path d="M657,57 L636,36" stroke="#ffeb3b" stroke-width="3" fill="none" />
  <path d="M743,143 L764,164" stroke="#ffeb3b" stroke-width="3" fill="none" />
  <path d="M657,143 L636,164" stroke="#ffeb3b" stroke-width="3" fill="none" />
  <path d="M743,57 L764,36" stroke="#ffeb3b" stroke-width="3" fill="none" />
