<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="600px" viewBox="0 0 800 600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Shepherd with Sheep</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Sky -->
        <rect fill="#B6D7EF" x="0" y="0" width="800" height="250"></rect>
        
        <!-- Hills -->
        <path d="M0,250 C100,200 200,230 300,210 C400,190 500,220 600,200 C700,180 800,220 800,250 L800,600 L0,600 L0,250" fill="#8BC34A"></path>
        
        <!-- Distant Mountains -->
        <path d="M0,250 L200,150 L300,200 L400,100 L500,180 L600,120 L800,250" fill="#9E9E9E" opacity="0.5"></path>
        
        <!-- Sun -->
        <circle fill="#FFD54F" cx="700" cy="100" r="60"></circle>
        <circle fill="#FFECB3" cx="700" cy="100" r="45"></circle>
        
        <!-- Clouds -->
        <circle fill="#FFFFFF" cx="200" cy="100" r="30" opacity="0.8"></circle>
        <circle fill="#FFFFFF" cx="230" cy="90" r="25" opacity="0.8"></circle>
        <circle fill="#FFFFFF" cx="250" cy="110" r="20" opacity="0.8"></circle>
        
        <circle fill="#FFFFFF" cx="500" cy="150" r="30" opacity="0.8"></circle>
        <circle fill="#FFFFFF" cx="530" cy="140" r="25" opacity="0.8"></circle>
        <circle fill="#FFFFFF" cx="550" cy="160" r="20" opacity="0.8"></circle>
        
        <!-- Tree -->
        <rect fill="#795548" x="650" y="320" width="20" height="80"></rect>
        <circle fill="#43A047" cx="660" cy="300" r="40"></circle>
        <circle fill="#43A047" cx="630" cy="280" r="30"></circle>
        <circle fill="#43A047" cx="690" cy="280" r="30"></circle>
        
        <!-- Shepherd -->
        <circle fill="#FFCC99" cx="400" cy="320" r="25"></circle> <!-- Head -->
        <rect fill="#795548" x="380" y="345" width="40" height="125"></rect> <!-- Body/Robe -->
        <rect fill="#5D4037" x="380" y="420" width="15" height="70"></rect> <!-- Left Leg -->
        <rect fill="#5D4037" x="405" y="420" width="15" height="70"></rect> <!-- Right Leg -->
        <rect fill="#FFCC99" x="350" y="355" width="20" height="50"></rect> <!-- Left Arm -->
        <rect fill="#FFCC99" x="430" y="355" width="20" height="50"></rect> <!-- Right Arm -->
        
        <!-- Shepherd's Staff -->
        <path d="M350,355 L330,415 L250,480" stroke="#A1887F" stroke-width="8" stroke-linecap="round"></path>
        <path d="M250,480 C240,475 235,460 245,450" stroke="#A1887F" stroke-width="8" stroke-linecap="round"></path>
        
        <!-- Sheep (Group 1) -->
        <circle fill="#FFFFFF" cx="150" cy="450" r="25"></circle> <!-- Body -->
        <circle fill="#E0E0E0" cx="150" cy="430" r="15"></circle> <!-- Head -->
        <rect fill="#616161" x="140" y="470" width="8" height="30"></rect> <!-- Left Leg -->
        <rect fill="#616161" x="152" y="470" width="8" height="30"></rect> <!-- Right Leg -->
        
        <circle fill="#FFFFFF" cx="200" cy="470" r="25"></circle> <!-- Body -->
        <circle fill="#E0E0E0" cx="200" cy="450" r="15"></circle> <!-- Head -->
        <rect fill="#616161" x="190" y="490" width="8" height="30"></rect> <!-- Left Leg -->
        <rect fill="#616161" x="202" y="490" width="8" height="30"></rect> <!-- Right Leg -->
        
        <!-- Sheep (Group 2) -->
        <circle fill="#FFFFFF" cx="500" cy="480" r="25"></circle> <!-- Body -->
        <circle fill="#E0E0E0" cx="500" cy="460" r="15"></circle> <!-- Head -->
        <rect fill="#616161" x="490" y="500" width="8" height="30"></rect> <!-- Left Leg -->
        <rect fill="#616161" x="502" y="500" width="8" height="30"></rect> <!-- Right Leg -->
        
        <circle fill="#FFFFFF" cx="550" cy="450" r="25"></circle> <!-- Body -->
        <circle fill="#E0E0E0" cx="550" cy="430" r="15"></circle> <!-- Head -->
        <rect fill="#616161" x="540" y="470" width="8" height="30"></rect> <!-- Left Leg -->
        <rect fill="#616161" x="552" y="470" width="8" height="30"></rect> <!-- Right Leg -->
        
        <circle fill="#FFFFFF" cx="590" cy="480" r="25"></circle> <!-- Body -->
        <circle fill="#E0E0E0" cx="590" cy="460" r="15"></circle> <!-- Head -->
        <rect fill="#616161" x="580" y="500" width="8" height="30"></rect> <!-- Left Leg -->
        <rect fill="#616161" x="592" y="500" width="8" height="30"></rect> <!-- Right Leg -->
        
        <!-- Small Lamb near Shepherd -->
        <circle fill="#FFFFFF" cx="450" cy="450" r="20"></circle> <!-- Body -->
        <circle fill="#E0E0E0" cx="450" cy="435" r="12"></circle> <!-- Head -->
        <rect fill="#616161" x="442" y="465" width="6" height="25"></rect> <!-- Left Leg -->
        <rect fill="#616161" x="452" y="465" width="6" height="25"></rect> <!-- Right Leg -->
    </g>
</svg>