<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="600px" viewBox="0 0 800 600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>The Good Shepherd</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Sky Background -->
        <rect fill="#87CEEB" x="0" y="0" width="800" height="300"></rect>
        
        <!-- Sun -->
        <circle fill="#FFD700" cx="650" cy="80" r="50"></circle>
        <circle fill="#FFFFFF" cx="650" cy="80" r="30" opacity="0.5"></circle>
        
        <!-- Clouds -->
        <path d="M50,100 C70,80 110,80 130,100 C150,80 190,80 210,100 C220,120 200,150 170,140 C160,160 120,160 110,140 C80,150 60,130 50,100" fill="#FFFFFF" opacity="0.8"></path>
        <path d="M350,120 C370,100 410,100 430,120 C450,100 490,100 510,120 C520,140 500,170 470,160 C460,180 420,180 410,160 C380,170 360,150 350,120" fill="#FFFFFF" opacity="0.8"></path>
        
        <!-- Hills Background -->
        <path d="M0,300 C100,250 200,280 300,260 C400,240 500,270 600,250 C700,230 800,260 800,300 L800,350 L0,350 Z" fill="#90EE90"></path>
        
        <!-- Meadow Ground -->
        <rect fill="#7CFC00" x="0" y="300" width="800" height="300"></rect>
        
        <!-- Distant Mountains -->
        <path d="M0,300 L100,220 L200,270 L300,200 L400,250 L500,180 L600,240 L700,190 L800,230 L800,300 Z" fill="#6B8E23" opacity="0.5"></path>
        
        <!-- Small Path -->
        <path d="M300,450 C350,440 400,460 450,440 C500,420 550,440 600,430 L600,600 L300,600 Z" fill="#D2B48C" opacity="0.5"></path>
        
        <!-- Shepherd -->
        <circle fill="#FFCC99" cx="400" cy="400" r="25"></circle> <!-- Head -->
        <rect fill="#8B4513" x="390" y="425" width="20" height="75"></rect> <!-- Body (Robe) -->
        <rect fill="#FFCC99" x="370" y="430" width="20" height="40"></rect> <!-- Left Arm -->
        <rect fill="#FFCC99" x="410" y="430" width="20" height="40"></rect> <!-- Right Arm -->
        <rect fill="#8B4513" x="390" y="500" width="10" height="60"></rect> <!-- Left Leg -->
        <rect fill="#8B4513" x="400" y="500" width="10" height="60"></rect> <!-- Right Leg -->
        
        <!-- Shepherd's Staff -->
        <path d="M435,450 L480,380 C485,375 490,380 485,385 L450,470" stroke="#8B4513" stroke-width="5" fill="none"></path>
        
        <!-- Facial Features -->
        <circle fill="#000000" cx="390" cy="395" r="3"></circle> <!-- Left Eye -->
        <circle fill="#000000" cx="410" cy="395" r="3"></circle> <!-- Right Eye -->
        <path d="M395,410 C400,413 405,413 410,410" stroke="#000000" stroke-width="1" fill="none"></path> <!-- Mouth (Smiling) -->
        <path d="M380,385 C375,380 370,375 375,370 C380,365 385,370 385,375 C385,380 385,380 380,385" fill="#8B4513"></path> <!-- Left Eyebrow/Hair -->
        <path d="M420,385 C425,380 430,375 425,370 C420,365 415,370 415,375 C415,380 415,380 420,385" fill="#8B4513"></path> <!-- Right Eyebrow/Hair -->
        <path d="M375,375 C385,365 415,365 425,375" stroke="#8B4513" stroke-width="8" fill="none"></path> <!-- Hair -->
        <path d="M370,380 C380,370 420,370 430,380" stroke="#8B4513" stroke-width="8" fill="none"></path> <!-- Hair -->
        
        <!-- Sheep Scattered Around -->
        
        <!-- Sheep 1 (Close to Shepherd) -->
        <ellipse fill="#FFFFFF" cx="460" cy="520" rx="25" ry="15"></ellipse> <!-- Body -->
        <circle fill="#FFFFFF" cx="430" cy="520" r="15"></circle> <!-- Head -->
        <circle fill="#000000" cx="425" cy="515" r="3"></circle> <!-- Left Eye -->
        <path d="M420,525 C423,528 427,528 430,525" stroke="#000000" stroke-width="1" fill="none"></path> <!-- Mouth -->
        <rect fill="#000000" x="455" y="530" width="5" height="20"></rect> <!-- Leg 1 -->
        <rect fill="#000000" x="465" y="530" width="5" height="20"></rect> <!-- Leg 2 -->
        <rect fill="#000000" x="445" y="530" width="5" height="20"></rect> <!-- Leg 3 -->
        <rect fill="#000000" x="475" y="530" width="5" height="20"></rect> <!-- Leg 4 -->
        
        <!-- Sheep 2 (Lamb being carried) -->
        <ellipse fill="#FFFFFF" cx="390" cy="400" rx="15" ry="10"></ellipse> <!-- Body -->
        <circle fill="#FFFFFF" cx="375" cy="400" r="10"></circle> <!-- Head -->
        <circle fill="#000000" cx="372" cy="397" r="2"></circle> <!-- Left Eye -->
        <path d="M370,405 C372,407 374,407 376,405" stroke="#000000" stroke-width="1" fill="none"></path> <!-- Mouth -->
        <rect fill="#FFCC99" x="365" y="410" width="25" height="40" opacity="0"></rect> <!-- Area over Shepherd's shoulder -->
        
        <!-- Sheep 3 -->
        <ellipse fill="#FFFFFF" cx="330" cy="480" rx="25" ry="15"></ellipse> <!-- Body -->
        <circle fill="#FFFFFF" cx="300" cy="480" r="15"></circle> <!-- Head -->
        <circle fill="#000000" cx="295" cy="475" r="3"></circle> <!-- Left Eye -->
        <path d="M290,485 C293,488 297,488 300,485" stroke="#000000" stroke-width="1" fill="none"></path> <!-- Mouth -->
        <rect fill="#000000" x="325" y="490" width="5" height="20"></rect> <!-- Leg 1 -->
        <rect fill="#000000" x="335" y="490" width="5" height="20"></rect> <!-- Leg 2 -->
        <rect fill="#000000" x="315" y="490" width="5" height="20"></rect> <!-- Leg 3 -->
        <rect fill="#000000" x="345" y="490" width="5" height="20"></rect> <!-- Leg 4 -->
        
        <!-- Sheep 4 -->
        <ellipse fill="#FFFFFF" cx="520" cy="480" rx="25" ry="15"></ellipse> <!-- Body -->
        <circle fill="#FFFFFF" cx="490" cy="480" r="15"></circle> <!-- Head -->
        <circle fill="#000000" cx="485" cy="475" r="3"></circle> <!-- Left Eye -->
        <path d="M480,485 C483,488 487,488 490,485" stroke="#000000" stroke-width="1" fill="none"></path> <!-- Mouth -->
        <rect fill="#000000" x="515" y="490" width="5" height="20"></rect> <!-- Leg 1 -->
        <rect fill="#000000" x="525" y="490" width="5" height="20"></rect> <!-- Leg 2 -->
        <rect fill="#000000" x="505" y="490" width="5" height="20"></rect> <!-- Leg 3 -->
        <rect fill="#000000" x="535" y="490" width="5" height="20"></rect> <!-- Leg 4 -->
        
        <!-- Sheep 5 (In Distance) -->
        <ellipse fill="#FFFFFF" cx="600" cy="450" rx="20" ry="10"></ellipse> <!-- Body -->
        <circle fill="#FFFFFF" cx="580" cy="450" r="10"></circle> <!-- Head -->
        <circle fill="#000000" cx="577" cy="447" r="2"></circle> <!-- Left Eye -->
        <rect fill="#000000" x="595" y="457" width="4" height="15"></rect> <!-- Leg 1 -->
        <rect fill="#000000" x="603" y="457" width="4" height="15"></rect> <!-- Leg 2 -->
        <rect fill="#000000" x="588" y="457" width="4" height="15"></rect> <!-- Leg 3 -->
        <rect fill="#000000" x="610" y="457" width="4" height="15"></rect> <!-- Leg 4 -->
        
        <!-- Sheep 6 (In Distance) -->
        <ellipse fill="#FFFFFF" cx="250" cy="430" rx="20" ry="10"></ellipse> <!-- Body -->
        <circle fill="#FFFFFF" cx="230" cy="430" r="10"></circle> <!-- Head -->
        <circle fill="#000000" cx="227" cy="427" r="2"></circle> <!-- Left Eye -->
        <rect fill="#000000" x="245" y="437" width="4" height="15"></rect> <!-- Leg 1 -->
        <rect fill="#000000" x="253" y="437" width="4" height="15"></rect> <!-- Leg 2 -->
        <rect fill="#000000" x="238" y="437" width="4" height="15"></rect> <!-- Leg 3 -->
        <rect fill="#000000" x="260" y="437" width="4" height="15"></rect> <!-- Leg 4 -->
        
        <!-- Shepherd's Robe Details -->
        <path d="M390,425 L390,500" stroke="#6B4226" stroke-width="2" fill="none"></path> <!-- Robe Fold -->
        <path d="M410,425 L410,500" stroke="#6B4226" stroke-width="2" fill="none"></path> <!-- Robe Fold -->
        <path d="M390,450 L410,450" stroke="#6B4226" stroke-width="2" fill="none"></path> <!-- Robe Belt -->
        
        <!-- Gentle Light Around The Good Shepherd -->
        <circle fill="#FFFDD0" cx="400" cy="400" r="100" opacity="0.1"></circle>
        <circle fill="#FFFDD0" cx="400" cy="400" r="70" opacity="0.1"></circle>
        <circle fill="#FFFDD0" cx="400" cy="400" r="40" opacity="0.1"></circle>
    </g>
</svg>