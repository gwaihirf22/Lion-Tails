<svg width="80" height="100" viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fretboard -->
  <rect x="10" y="10" width="60" height="80" fill="#f9f5e3" stroke="#000" stroke-width="1"/>
  
  <!-- Strings -->
  <line x1="10" y1="22" x2="70" y2="22" stroke="#888" stroke-width="1"/>
  <line x1="10" y1="34" x2="70" y2="34" stroke="#888" stroke-width="1"/>
  <line x1="10" y1="46" x2="70" y2="46" stroke="#888" stroke-width="1"/>
  <line x1="10" y1="58" x2="70" y2="58" stroke="#888" stroke-width="1"/>
  <line x1="10" y1="70" x2="70" y2="70" stroke="#888" stroke-width="1"/>
  <line x1="10" y1="82" x2="70" y2="82" stroke="#888" stroke-width="1"/>
  
  <!-- Frets -->
  <line x1="10" y1="10" x2="70" y2="10" stroke="#000" stroke-width="2"/>
  <line x1="10" y1="28" x2="70" y2="28" stroke="#000" stroke-width="1"/>
  <line x1="10" y1="46" x2="70" y2="46" stroke="#000" stroke-width="1"/>
  <line x1="10" y1="64" x2="70" y2="64" stroke="#000" stroke-width="1"/>
  <line x1="10" y1="82" x2="70" y2="82" stroke="#000" stroke-width="1"/>
  
  <!-- Fingers -->
  <circle cx="22" cy="28" r="7" fill="#BDB2FF"/>
  <text x="22" y="31" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">1</text>
  
  <circle cx="58" cy="28" r="7" fill="#BDB2FF"/>
  <text x="58" y="31" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">2</text>
  
  <circle cx="34" cy="46" r="7" fill="#BDB2FF"/>
  <text x="34" y="49" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">3</text>
  
  <!-- Chord name -->
  <text x="40" y="100" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">G7</text>
</svg>
