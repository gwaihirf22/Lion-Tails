## Lion Tails — SWAG reverse proxy config
##
## Install to:  /mnt/user/appdata/swag/nginx/proxy-confs/liontails.subdomain.conf
## Then:        docker restart swag
##
## Adapted from the production-verified neighborly conf. Note that the upstream
## port is the CONTAINER-INTERNAL port (5000), not the published host port
## (3002) — SWAG reaches the app over the shared `paulproxy` docker network by
## container name, so it never goes via the host port mapping.
##
## Cloudflare must be set to: A record -> server IP, proxied (orange cloud),
## SSL/TLS mode Full (Strict).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name liontails.paul-blake.com;

    include /config/nginx/ssl.conf;

    # Trust Cloudflare IP ranges so logs and rate limits see the real visitor IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Story illustrations are generated server-side; no large uploads expected,
    # but image-analysis requests post base64 payloads in the JSON body.
    client_max_body_size 25m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;

        # NB: do NOT set proxy_read_timeout / proxy_send_timeout here.
        # /config/nginx/proxy.conf (included above) already sets both to 240s,
        # and re-declaring them in the same location block is a hard
        # "duplicate directive" failure in nginx -t. 240s is the effective
        # ceiling for a single story-generation request.

        set $upstream_app lion-tails;
        set $upstream_port 5000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
