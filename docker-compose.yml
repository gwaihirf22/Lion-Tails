# Reference copy of the production compose file.
#
# The authoritative file lives on the Unraid host at
# /mnt/user/appdata/lion-tails/docker-compose.yml. CI deliberately does NOT
# overwrite it — keep the two in sync by hand when the service shape changes.
#
# Secrets come from a .env file alongside it, written transiently by the deploy
# workflow and removed afterwards.

services:
  # NB: the service name becomes a DNS alias on every network this container
  # joins. It must NOT be a generic name like "postgres" -- paulproxy is a
  # SHARED external network and neighborly-postgres already publishes the
  # "postgres" alias there. Two containers sharing an alias makes Docker
  # round-robin between them, which silently sent roughly half of neighborly's
  # new database connections to this database instead.
  lion-tails-db:
    image: postgres:15
    container_name: lion-tails-postgres
    restart: unless-stopped
    # No published port: 5432 on the host is already taken by neighborly-postgres.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=liontails
      - POSTGRES_USER=liontails
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      # Deliberately NOT on paulproxy: the database has no business being
      # reachable by the ~30 other containers on the shared proxy network.
      - lion-tails-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liontails"]
      interval: 30s
      timeout: 10s
      retries: 3

  lion-tails:
    image: flyingoat03/lion-tails:latest
    container_name: lion-tails
    restart: unless-stopped
    ports:
      - "3003:5000" # host 3003 -> container 5000 (3002 is taken by libation-gui)
    depends_on:
      lion-tails-db:
        condition: service_healthy
    volumes:
      # Generated DALL-E story images, written to process.cwd()/public/images/stories
      - story_images:/app/public/images/stories
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://liontails:${POSTGRES_PASSWORD}@lion-tails-db:5432/liontails
      - FRONTEND_URL=https://liontails.paul-blake.com
      - SESSION_SECRET=${SESSION_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=587
      - EMAIL_SECURE=false
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=Lion Tails <no-reply@paul-blake.com>
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - paulproxy          # reachable by SWAG
      - lion-tails-internal # reaches the database

networks:
  paulproxy:
    external: true
  lion-tails-internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  story_images:
    driver: local
