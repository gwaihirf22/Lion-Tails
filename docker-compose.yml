# Reference copy of the production compose file.
#
# The authoritative file lives on the Unraid host at
# /mnt/user/appdata/lion-tails/docker-compose.yml. CI deliberately does NOT
# overwrite it — keep the two in sync by hand when the service shape changes.
#
# Secrets come from a .env file alongside it, written transiently by the deploy
# workflow and removed afterwards.

services:
  # NB: see docs/decisions.md §10.
  # The service name becomes a DNS alias on every network this container
  # joins. It must NOT be a generic name like "postgres" -- paulproxy is a
  # SHARED external network and neighborly-postgres already publishes the
  # "postgres" alias there. Two containers sharing an alias makes Docker
  # round-robin between them, which silently sent roughly half of neighborly's
  # new database connections to this database instead.
  lion-tails-db:
    image: postgres:15
    container_name: lion-tails-postgres
    restart: unless-stopped
    # No published port: 5432 on the host is already taken by neighborly-postgres.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=liontails
      - POSTGRES_USER=liontails
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      # Deliberately NOT on paulproxy: the database has no business being
      # reachable by the ~30 other containers on the shared proxy network.
      - lion-tails-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liontails"]
      interval: 30s
      timeout: 10s
      retries: 3

  lion-tails:
    image: flyingoat03/lion-tails:latest
    container_name: lion-tails
    restart: unless-stopped
    ports:
      - "3003:5000" # host 3003 -> container 5000 (3002 is taken by libation-gui)
    depends_on:
      lion-tails-db:
        condition: service_healthy
    volumes:
      # Generated DALL-E story images, written to process.cwd()/public/images/stories
      - story_images:/app/public/images/stories
      # Organisation Admin key for the cost bill check, read-only. The file is uid 1001 (the app user), mode 400.
      - ./openai-admin-key:/run/secrets/openai-admin-key:ro
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://liontails:${POSTGRES_PASSWORD}@lion-tails-db:5432/liontails
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - MODEL_CONTEXT_LIMIT=16384
      - SESSION_SECRET=${SESSION_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COSTS_ADMIN_KEY_FILE=/run/secrets/openai-admin-key
      # Scopes the bill check to the Lion's Tail project (not a secret).
      - COSTS_PROJECT_ID=proj_uQjN5Xv24HRqdr0AqaV9E0zp
      # The signup challenge (Cloudflare Turnstile). The SITE key is public and
      # is served to the browser; the SECRET is what the server checks with.
      # TURNSTILE_SECRET_FILE is the other accepted form, like
      # COSTS_ADMIN_KEY_FILE above -- whichever is set, the env wins.
      # In production, NO SECRET MEANS NO SIGN-UPS: see server/lib/turnstile.ts.
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET}
      # Account alerts, on the channel Blake already reads. The TOKEN is a
      # credential -- anyone holding it can send and read as the bot -- and
      # TELEGRAM_BOT_TOKEN_FILE is the other accepted form, like
      # COSTS_ADMIN_KEY_FILE. The CHAT ID is not a secret. Both blank is off,
      # and /admin/accounts says so rather than pretending to be watching.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Only used to put a link in an alert. Not a secret, and optional.
      - PUBLIC_URL=https://liontails.paul-blake.com
      # Password-reset email, over SMTP. In production this is a dedicated
      # Gmail account with an APP PASSWORD (a credential: full access to that
      # mailbox), sending as the domain alias in MAIL_FROM. SMTP_PASSWORD_FILE
      # pointing at a root-only file is the other accepted form, like
      # COSTS_ADMIN_KEY_FILE. All blank means reset requests answer 503 in
      # production rather than promising an email nobody can send.
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
    # The image declares this same probe itself now (Dockerfile HEALTHCHECK),
    # so it is healthy without this entry; kept so the host's copy and the
    # image agree on the numbers. NOTE that `restart: unless-stopped` does NOT
    # restart an UNHEALTHY container -- /api/health answering 503 (database
    # unreachable, schema drifted, in-memory fallback in production) leaves
    # the container running, red in `docker ps`, and serving writes that go
    # nowhere until somebody looks. The usual fix is the `autoheal` container
    # (willfarrell/autoheal) watching for the label `autoheal=true` on this
    # service: Blake's call, on the host, not something CI can do.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - paulproxy          # reachable by SWAG
      - lion-tails-internal # reaches the database

networks:
  paulproxy:
    external: true
  lion-tails-internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  story_images:
    driver: local
