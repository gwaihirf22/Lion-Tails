name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      # The production bundle must not reference Vite. server/prod.ts avoids
      # importing server/vite.ts precisely so the runtime image can be built
      # with --omit=dev; this guards that invariant.
      - name: Assert production bundle is free of Vite
        run: |
          test -f dist/prod.js
          test -f dist/public/index.html
          if grep -qE 'from ?"vite"|require\("vite"\)' dist/prod.js; then
            echo "dist/prod.js imports Vite — the dev/prod entrypoint split has regressed."
            exit 1
          fi
          echo "OK: dist/prod.js has no Vite import."

  docker:
    name: Docker build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: lion-tails:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lion-tails:ci
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Full audit report
        if: always()
        run: npm audit --json > npm-audit.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit.json
