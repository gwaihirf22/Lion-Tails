name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      # The production bundle must not reference Vite. server/prod.ts avoids
      # importing server/vite.ts precisely so the runtime image can be built
      # with --omit=dev; this guards that invariant.
      - name: Assert production bundle is free of Vite
        run: |
          test -f dist/prod.js
          test -f dist/public/index.html
          if grep -qE 'from ?"vite"|require\("vite"\)' dist/prod.js; then
            echo "dist/prod.js imports Vite — the dev/prod entrypoint split has regressed."
            exit 1
          fi
          echo "OK: dist/prod.js has no Vite import."

      # Building the bundle is not enough. esbuild emits ESM with
      # --packages=external, so a named import from a CommonJS dependency
      # (e.g. `import { Pool } from "pg"`) compiles fine and only fails when
      # Node instantiates the module at runtime. Boot it for real.
      - name: Smoke-test the production bundle
        env:
          NODE_ENV: production
          PORT: '5001'
          # Required in production by server/config.ts; values are irrelevant here.
          SESSION_SECRET: ci-smoke-session-secret
          # No DATABASE_URL on purpose: exercises the in-memory path, where
          # /api/health must still answer 200 with persistence:false.
        run: |
          set -euo pipefail
          node dist/prod.js > /tmp/app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ok=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "The server process exited during startup."
              break
            fi
            if curl -fsS http://127.0.0.1:5001/api/health -o /tmp/health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done

          echo "--- server output ---"
          cat /tmp/app.log

          if [ "$ok" -ne 1 ]; then
            echo "FAIL: the production bundle did not serve /api/health."
            exit 1
          fi

          echo "--- /api/health ---"
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"persistence":false' /tmp/health.json
          echo "OK: production bundle boots and serves /api/health."

  docker:
    name: Docker build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: lion-tails:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lion-tails:ci
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Full audit report
        if: always()
        run: npm audit --json > npm-audit.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit.json
