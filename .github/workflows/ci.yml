name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest

    # A throwaway Postgres for the second smoke test below. The first smoke test
    # runs without DATABASE_URL and therefore never instantiates pg, drizzle,
    # connect-pg-simple, the migrator or verifyOrmSchema -- which is exactly
    # where every bug that reached production actually lived.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: liontails
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: liontails
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liontails"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      # The production bundle must not reference Vite. server/prod.ts avoids
      # importing server/vite.ts precisely so the runtime image can be built
      # with --omit=dev; this guards that invariant.
      - name: Assert production bundle is free of Vite
        run: |
          test -f dist/prod.js
          test -f dist/public/index.html
          if grep -qE 'from ?"vite"|require\("vite"\)' dist/prod.js; then
            echo "dist/prod.js imports Vite — the dev/prod entrypoint split has regressed."
            exit 1
          fi
          echo "OK: dist/prod.js has no Vite import."

      # The reader's palette, font and typeset rules are attribute selectors on
      # values that come from the DATABASE, so nothing in the source references
      # them as literal class names. That is deliberate -- it is what makes them
      # immune to the bug this check exists to catch.
      #
      # BookPage used to build its background class by interpolation:
      #   `border-amber-800/60 ${getBgColorClass()}/95`  ->  "bg-[#fff8e6]/95"
      # Tailwind's JIT scanner only sees string literals, so that class was
      # never emitted and the entire colour picker did nothing for months. The
      # swatches kept a second literal colour map, so they LOOKED right.
      # Nothing failed. Nothing logged. Only a human clicking it would know.
      #
      # So: assert the rules are actually in the shipped stylesheet.
      # The app is themed by CSS custom properties now, so a hardcoded Tailwind
      # colour is a component that silently opts out: it looks right in Paper
      # and wrong in Sepia, and unreadable in Night. There were 247 of them
      # before this gate existed. Two deliberate exceptions are allowed by
      # name -- scrims, which are meant to be black in every palette.
      # The Rules of Hooks are a runtime rule about the ORDER of calls, so
      # tsc and the build are both blind to them. Two useMemo calls placed
      # below an "if (isLoading) return" guard once rendered the Heroes of
      # Faith page as a blank screen while every other check passed.
      - name: React hooks rules
        run: npm run lint

      - name: No hardcoded colours outside the design tokens
        run: |
          set -e
          HITS=$(grep -rEon '\b(bg|text|border|from|to|via|ring|fill|stroke|placeholder|divide)-(white|black|slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose)(-[0-9]{2,3})?(\/[0-9]{1,3})?\b' \
            --include=*.tsx client/src \
            | grep -v '/components/ui/' \
            | grep -v 'bg-black/40' \
            || true)
          if [ -n "$HITS" ]; then
            echo "Hardcoded colours found. Use a design token instead:"
            echo "  neutrals  -> bg-card, bg-muted, text-foreground, text-muted-foreground, border-border"
            echo "  brand     -> text-primary, text-secondary, bg-primary + text-primary-foreground"
            echo "  meaning   -> text-warning / bg-warning-surface, text-success, text-destructive"
            echo ""
            echo "$HITS"
            exit 1
          fi
          echo "OK: every colour outside the shadcn primitives comes from a token."

      - name: Verify the reader's styles reached the CSS bundle
        run: |
          set -e
          CSS=$(ls dist/public/assets/*.css | head -1)
          test -n "$CSS"
          check () { # description, pattern, minimum
            n=$(grep -o "$2" "$CSS" | wc -l)
            if [ "$n" -lt "$3" ]; then
              echo "FAIL: $1 — found $n occurrences of '$2', expected at least $3."
              echo "The rule is in the source but not in the built CSS."
              exit 1
            fi
            echo "OK: $1 ($n)"
          }
          check "palette rules"      'data-palette='     4
          check "font rules"         'data-font='        5
          check "typeset rules"      'data-typeset='     2
          check "the reading surface" '\.reader-surface' 1
          check "web fonts swap"     'font-display:swap' 1
          # The palette colours themselves, not just the selectors.
          HEXES=$(grep -o 'fbfaf7\|f4ecd8\|16181c' "$CSS" | sort -u | wc -l)
          if [ "$HEXES" -ne 3 ]; then
            echo "FAIL: expected all 3 palette background colours in the CSS, found $HEXES."
            exit 1
          fi
          echo "OK: all 3 palette backgrounds present."
          # Per-family font budget. Only the latin cut is ever downloaded.
          for FAM in literata eb-garamond lexend; do
            KB=$(ls -l dist/public/assets/*"$FAM"*latin-* 2>/dev/null | grep -v latin-ext | awk '{s+=$5} END {print int(s/1024)}')
            if [ -n "$KB" ] && [ "$KB" -gt 120 ]; then
              echo "FAIL: $FAM is ${KB}KB, over the 120KB per-family budget."
              echo "A non-latin subset has probably crept into client/src/fonts.css."
              exit 1
            fi
            echo "OK: $FAM ${KB}KB"
          done

      # Building the bundle is not enough. esbuild emits ESM with
      # --packages=external, so a named import from a CommonJS dependency
      # (e.g. `import { Pool } from "pg"`) compiles fine and only fails when
      # Node instantiates the module at runtime. Boot it for real.
      - name: Smoke-test the production bundle
        env:
          NODE_ENV: production
          PORT: '5001'
          # Required in production by server/config.ts; values are irrelevant here.
          SESSION_SECRET: ci-smoke-session-secret
          # No DATABASE_URL on purpose: exercises the in-memory path, where
          # /api/health must still answer 200 with persistence:false.
        run: |
          set -euo pipefail
          node dist/prod.js > /tmp/app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ok=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "The server process exited during startup."
              break
            fi
            if curl -fsS http://127.0.0.1:5001/api/health -o /tmp/health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done

          echo "--- server output ---"
          cat /tmp/app.log

          if [ "$ok" -ne 1 ]; then
            echo "FAIL: the production bundle did not serve /api/health."
            exit 1
          fi

          echo "--- /api/health ---"
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"persistence":false' /tmp/health.json
          echo "OK: production bundle boots and serves /api/health."

      # The smoke test above deliberately runs with no DATABASE_URL, so it never
      # touches the database code. That leaves the modules where the real bugs
      # lived completely unexercised in CI:
      #
      #   - pg / drizzle-orm / connect-pg-simple are CommonJS. A named import
      #     from them compiles and only fails when Node instantiates the module
      #     -- and those imports live in server/db.ts, which the no-database
      #     path never loads.
      #   - a migration that does not produce the schema the ORM expects (a
      #     registration once 500'd with `column first_name of relation users
      #     does not exist`).
      #   - reference data seeded into memory instead of the database.
      #
      # So: migrate a real database, boot against it, and assert.
      - name: Smoke-test against a real database
        env:
          NODE_ENV: production
          PORT: '5002'
          SESSION_SECRET: ci-smoke-session-secret
          DATABASE_URL: postgresql://liontails:ci-postgres-password@127.0.0.1:5432/liontails
        run: |
          set -euo pipefail

          # ubuntu-latest ships postgresql-client, but say so plainly if that
          # ever changes rather than failing inside an assertion.
          if ! command -v psql >/dev/null; then
            echo "psql not found; installing postgresql-client."
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi

          echo "--- applying migrations ---"
          node scripts/migrate.js

          # The migration is the only thing allowed to create tables, so the
          # table set is an assertion in itself. 13 = 12 app tables + session.
          # Update this deliberately when a migration adds one: a bare count
          # cannot say WHICH table is missing, so the names are printed on
          # failure rather than leaving the next person to run \dt themselves.
          EXPECTED_TABLES=13
          TABLES=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from pg_tables where schemaname='public'")
          echo "tables in public: $TABLES"
          if [ "$TABLES" -ne "$EXPECTED_TABLES" ]; then
            psql "$DATABASE_URL" -c "\dt"
            echo "FAIL: expected exactly $EXPECTED_TABLES tables, found $TABLES."
            echo "If a migration added or removed one, update EXPECTED_TABLES here."
            exit 1
          fi

          # generation_records is written on every attempt, so its absence is a
          # silent loss of telemetry rather than a crash. Assert the shape the
          # recorder depends on, and that no credential column exists.
          psql "$DATABASE_URL" -tAc \
            "select column_name from information_schema.columns
             where table_name='generation_records' order by column_name" > /tmp/gr-cols.txt
          for col in generation_id model provider tier using_own_key outcome steps; do
            grep -qx "$col" /tmp/gr-cols.txt || {
              echo "FAIL: generation_records is missing column $col"; cat /tmp/gr-cols.txt; exit 1; }
          done
          if grep -qiE "api_key|apikey|base_url|baseurl" /tmp/gr-cols.txt; then
            echo "FAIL: generation_records has a credential-shaped column:"
            grep -iE "api_key|apikey|base_url|baseurl" /tmp/gr-cols.txt
            exit 1
          fi
          echo "generation_records shape ok, no credential columns"

          # verifyOrmSchema() detects missing COLUMNS only. It cannot see a
          # missing index or a wrong ON DELETE, and two of those are
          # load-bearing here, so they are asserted explicitly.

          # This partial index IS the "one summary at a time per universe"
          # guarantee. An application check would race two clicks past it.
          psql "$DATABASE_URL" -tAc \
            "select indexname from pg_indexes where tablename='story_jobs'" \
            | grep -qx idx_story_jobs_one_active_summary || {
              echo "FAIL: idx_story_jobs_one_active_summary is missing."; exit 1; }

          # 'n' = SET NULL. A cascade here would delete the user's stories when
          # a universe is deleted -- the one irreversible mistake in this design.
          DEL=$(psql "$DATABASE_URL" -tAc \
            "select confdeltype from pg_constraint
              where conrelid='user_stories'::regclass
                and confrelid='story_universes'::regclass and contype='f'")
          if [ "$DEL" != "n" ]; then
            echo "FAIL: user_stories.universe_id is ON DELETE '$DEL', expected 'n' (SET NULL)."
            echo "Deleting a universe must leave its stories, not delete them."
            exit 1
          fi
          echo "universe constraints ok: one-active-summary index present, universe_id is SET NULL"

          node dist/prod.js > /tmp/app-db.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ok=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "The server process exited during startup."
              break
            fi
            if curl -fsS http://127.0.0.1:5002/api/health -o /tmp/health-db.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done

          echo "--- server output ---"
          cat /tmp/app-db.log

          if [ "$ok" -ne 1 ]; then
            echo "FAIL: the bundle did not serve /api/health against a database."
            exit 1
          fi

          echo "--- /api/health ---"
          cat /tmp/health-db.json
          grep -q '"persistence":true' /tmp/health-db.json
          grep -q '"schema":"ok"' /tmp/health-db.json

          # Read the row count from SQL, NOT from /api/heroes. The in-memory
          # fallback serves heroes whether or not anything was persisted -- that
          # is precisely why the original seeding race went unnoticed, and
          # asserting via the endpoint would not have caught it.
          #
          # The expected number comes from the DATA FILE, not a literal. It was
          # hardcoded to 15, which was correct until heroes were added and then
          # broke the build for a reason that had nothing to do with seeding.
          # The invariant worth asserting is "the database holds what the seed
          # defines", and that survives every future addition.
          EXPECTED_HEROES=$(npx tsx -e 'import { heroesOfFaithData } from "./server/data/heroes"; console.log(heroesOfFaithData.length)')
          if [ -z "$EXPECTED_HEROES" ] || [ "$EXPECTED_HEROES" -lt 1 ]; then
            echo "FAIL: could not read the hero list, or it is empty."
            exit 1
          fi
          HEROES=$(psql "$DATABASE_URL" -tAc "select count(*) from heroes_of_faith")
          echo "heroes_of_faith rows: $HEROES (seed defines $EXPECTED_HEROES)"
          if [ "$HEROES" -ne "$EXPECTED_HEROES" ]; then
            echo "FAIL: reference data was not persisted to the database."
            echo "The seed defines $EXPECTED_HEROES heroes; the table holds $HEROES."
            exit 1
          fi

          echo "OK: migrated, booted, schema verified, reference data persisted."

      # A check that cannot fail is not a check. verifyOrmSchema is the guard
      # against the class of bug that broke registration, so prove it actually
      # rejects a drifted schema rather than assuming it would.
      - name: Assert the schema check fails when the schema is wrong
        env:
          NODE_ENV: production
          PORT: '5003'
          SESSION_SECRET: ci-smoke-session-secret
          DATABASE_URL: postgresql://liontails:ci-postgres-password@127.0.0.1:5432/liontails
        run: |
          set -euo pipefail

          psql "$DATABASE_URL" -c "ALTER TABLE users DROP COLUMN first_name"

          node dist/prod.js > /tmp/app-drift.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          # curl -w '%{http_code}' already prints 000 when it cannot connect, so
          # do NOT add `|| echo 000` -- that appends a second 000 and the loop
          # then breaks on the first attempt with a nonsense "000000".
          CODE=000
          for _ in $(seq 1 30); do
            kill -0 "$APP_PID" 2>/dev/null || break
            CODE=$(curl -s -o /tmp/health-drift.json -w '%{http_code}' \
              http://127.0.0.1:5003/api/health) || true
            [ "$CODE" != "000" ] && break
            sleep 1
          done

          echo "--- /api/health returned $CODE ---"
          cat /tmp/health-drift.json 2>/dev/null || true
          echo

          if [ "$CODE" != "503" ]; then
            cat /tmp/app-drift.log
            echo "FAIL: a missing column did not produce a 503. The schema check is not working."
            exit 1
          fi
          grep -q '"schema":"mismatch"' /tmp/health-drift.json
          grep -q 'first_name' /tmp/health-drift.json
          echo "OK: schema drift is detected and reported, naming the missing column."

  docker:
    name: Docker build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: lion-tails:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lion-tails:ci
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Full audit report
        if: always()
        run: npm audit --json > npm-audit.json || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit.json

  # Relocated from the former deploy.yml so that a deploy cannot outrun its own
  # tests. Both workflows used to trigger on push to main independently: CI and
  # deploy started against the same SHA with no ordering and no data flow, so a
  # red typecheck, a failed smoke test or a high-severity audit did not stop the
  # container being replaced. As a job with needs:, that race is gone.
  #
  # github.sha is correct here without any extra handling, because this now runs
  # inside the same workflow run as the tests -- which is why folding the job in
  # was preferred over a workflow_run trigger.
  deploy:
    name: Deploy to Unraid Server
    needs: [build, docker, audit]
    if: "(github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'"
    # Job-level, so it preserves exactly the semantics the standalone workflow
    # had without also cancelling in-progress CI runs.
    #
    # Merging several PRs in a row otherwise queues a full image build and a
    # container restart for each one, on a single self-hosted runner. Superseded
    # runs are cancelled so a burst of merges deploys the final state once. The
    # cancellation window includes the SSH step, which is seconds out of a
    # multi-minute run and self-correcting -- the superseding run re-runs the
    # same idempotent command. Set cancel-in-progress to false to serialise
    # instead, at the cost of building every commit.
    concurrency:
      group: deploy-main
      cancel-in-progress: true
    runs-on: [self-hosted, linux, x64, unraid-lion-tails]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/lion-tails:latest
            ${{ secrets.DOCKER_USERNAME }}/lion-tails:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_RAW }}

      - name: Deploy to Unraid
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          UNRAID_HOST: ${{ secrets.UNRAID_HOST }}
          UNRAID_USERNAME: ${{ secrets.UNRAID_USERNAME }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$UNRAID_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

          # The whole remote script is streamed over stdin. Secrets are written
          # into the heredoc body here rather than passed as ssh arguments, so
          # they never appear in the remote process list and values containing
          # spaces or quotes survive intact.
          {
            echo 'set -euo pipefail'
            echo 'cd /mnt/user/appdata/lion-tails'
            echo 'umask 077'
            echo "cat > .env <<'ENVEOF'"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'SESSION_SECRET=%s\n'    "$SESSION_SECRET"
            printf 'OPENAI_API_KEY=%s\n'    "$OPENAI_API_KEY"
            printf 'EMAIL_HOST=%s\n'        "$EMAIL_HOST"
            printf 'EMAIL_USER=%s\n'        "$EMAIL_USER"
            printf 'EMAIL_PASSWORD=%s\n'    "$EMAIL_PASSWORD"
            echo 'ENVEOF'
            cat <<'REMOTE'
          trap 'rm -f /mnt/user/appdata/lion-tails/.env' EXIT

          echo "--- Pulling latest image ---"
          docker compose pull

          echo "--- Starting containers ---"
          docker compose up -d

          echo "--- Waiting for the app to become healthy ---"
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' lion-tails 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          echo "Container health: $status"

          echo "--- Cleaning up old images ---"
          docker image prune -f --filter "label=com.docker.compose.project=lion-tails"

          if [ "$status" != "healthy" ]; then
            echo "Container did not become healthy. Recent logs:"
            docker logs --tail 80 lion-tails || true
            exit 1
          fi

          echo "--- Deployment completed successfully ---"
          REMOTE
          } | ssh "$UNRAID_USERNAME@$UNRAID_HOST" 'bash -s'
