name: Deploy to Unraid Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Merging several PRs in a row otherwise queues a full image build and a
# container restart for each one, on a single self-hosted runner. Superseded
# runs are cancelled so a burst of merges deploys the final state once.
#
# The cancellation window includes the SSH step, so a run can in principle be
# killed inside `docker compose up -d`. That is seconds out of a multi-minute
# run and self-correcting -- the superseding run re-runs the same idempotent
# command. Set cancel-in-progress to false to serialise instead, at the cost of
# building every commit.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, unraid-lion-tails]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/lion-tails:latest
            ${{ secrets.DOCKER_USERNAME }}/lion-tails:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_RAW }}

      - name: Deploy to Unraid
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          UNRAID_HOST: ${{ secrets.UNRAID_HOST }}
          UNRAID_USERNAME: ${{ secrets.UNRAID_USERNAME }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$UNRAID_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

          # The whole remote script is streamed over stdin. Secrets are written
          # into the heredoc body here rather than passed as ssh arguments, so
          # they never appear in the remote process list and values containing
          # spaces or quotes survive intact.
          {
            echo 'set -euo pipefail'
            echo 'cd /mnt/user/appdata/lion-tails'
            echo 'umask 077'
            echo "cat > .env <<'ENVEOF'"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'SESSION_SECRET=%s\n'    "$SESSION_SECRET"
            printf 'OPENAI_API_KEY=%s\n'    "$OPENAI_API_KEY"
            printf 'EMAIL_HOST=%s\n'        "$EMAIL_HOST"
            printf 'EMAIL_USER=%s\n'        "$EMAIL_USER"
            printf 'EMAIL_PASSWORD=%s\n'    "$EMAIL_PASSWORD"
            echo 'ENVEOF'
            cat <<'REMOTE'
          trap 'rm -f /mnt/user/appdata/lion-tails/.env' EXIT

          echo "--- Pulling latest image ---"
          docker compose pull

          echo "--- Starting containers ---"
          docker compose up -d

          echo "--- Waiting for the app to become healthy ---"
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' lion-tails 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          echo "Container health: $status"

          echo "--- Cleaning up old images ---"
          docker image prune -f --filter "label=com.docker.compose.project=lion-tails"

          if [ "$status" != "healthy" ]; then
            echo "Container did not become healthy. Recent logs:"
            docker logs --tail 80 lion-tails || true
            exit 1
          fi

          echo "--- Deployment completed successfully ---"
          REMOTE
          } | ssh "$UNRAID_USERNAME@$UNRAID_HOST" 'bash -s'
