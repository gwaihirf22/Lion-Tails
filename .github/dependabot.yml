# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Mirrors the configuration already used in the neighborly and
# paul-blake-website repositories, so all three behave the same way.
#
# Production updates are limited to `patch` deliberately. A minor bump to a
# runtime dependency can change behaviour, and this project's CI is a typecheck,
# a build and two smoke tests -- enough to catch a crash, not enough to catch a
# subtle regression. Dev dependencies get minor + patch because a broken build
# tool fails loudly and immediately.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # Grouping notes, from the Dependabot options reference:
    #
    #   "Any outdated dependencies that do not match a rule are updated in
    #    individual pull requests."
    #
    # So every category needs a group, or it arrives one-PR-per-package. The
    # first run opened 16 PRs largely because of the two gaps below.
    #
    #   "applies-to ... When undefined, defaults to version updates."
    #
    # Security updates are therefore NOT covered by a normal group. cookie,
    # pg-protocol, pg-cloudflare and foreground-child each got their own PR for
    # exactly this reason. They need a group of their own.
    #
    # Tiers are kept in separate PRs on purpose. The point is fewer PRs, not one
    # undifferentiated PR -- a production minor deserves a different glance from
    # a dev patch, and merging them together would remove that distinction.
    groups:
      # Everything a published advisory triggers, in one PR. These are the ones
      # worth merging promptly.
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

      development-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

      # Safest production tier: no behaviour change intended.
      production-patch:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "patch"

      # Production minors can change behaviour, so they are batched separately
      # rather than folded in with patches -- previously these fell through the
      # groups entirely and arrived individually (react-icons,
      # @radix-ui/react-tooltip).
      production-minor:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"

      # Catch-all, deliberately LAST: Dependabot puts each dependency in the
      # first group it matches, so this only sweeps up what the tiers above
      # miss. That is indirect (transitive) dependencies -- cookie,
      # foreground-child and serve-static each got their own PR because every
      # group above filters on dependency-type, which matches DIRECT
      # dependencies only, and a lockfile-only bump matches none of them.
      #
      # Production MAJORS are deliberately NOT swept in here. They also fall
      # through the tiers, but batching them would defeat the point: a major is
      # the one update that most needs looking at on its own. date-fns 3->4 and
      # lucide-react 0->1 turned out to be clean; zod-validation-error 3->5
      # needs a zod 4 migration first. Reviewing those as one PR would have
      # meant either blocking two safe updates or merging a broken one.
      indirect-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      prefix-development: "chore(dev)"
      include: "scope"
    allow:
      - dependency-type: "all"
    # Majors for these are reviewed by hand. Each one has a specific reason:
    ignore:
      # React 19 is a large migration across ~45 shadcn components.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Owns the schema. A bump must be rehearsed against a real Postgres --
      # verifyOrmSchema derives its expectation from drizzle's getTableColumns(),
      # so an internals change can silently disable the schema guard rather than
      # failing loudly. See docs/decisions.md.
      - dependency-name: "drizzle-orm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-kit"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 is a config-format rewrite, and tailwind-scrollbar 4 requires
      # it -- the two move together or not at all.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-scrollbar"
        update-types: ["version-update:semver-major"]
      # A Vite major can change the plugin API, and
      # @replit/vite-plugin-shadcn-theme-json (unmaintained since 2024-11, no
      # public repo) generates every shadcn CSS variable. If it stops emitting
      # them the site loses its palette silently. Replace that plugin first.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # Express 5 changes routing and error handling.
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # TypeScript majors reintroduce type errors wholesale. This repo reached
      # zero errors for the first time in its history; a major goes in
      # deliberately, on its own, not on a Monday morning.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # One PR for all action bumps rather than one per action. The first run
    # opened five separate PRs for checkout, setup-node, login-action,
    # setup-buildx-action and build-push-action.
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # Picks up the root Dockerfile (node:20-alpine in all three stages).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    # The base image tracks the Node version the app is tested against.
    # package.json says >=20 and CI runs 20, so a major bump here would put
    # production on a runtime nothing has verified. Do it deliberately, with
    # engines/, CI and the Dockerfile moving together.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
